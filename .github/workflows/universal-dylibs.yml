name: Universal Dylibs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          go version
          swift --version

      - name: Build universal dylibs
        run: |
          set -euo pipefail
          pkgs=()
          while IFS= read -r file; do
            pkg=$(dirname "$file")
            if [ "$pkg" = "./workoutkit" ]; then
              continue
            fi
            pkgs+=("$pkg")
          done < <(find . -mindepth 1 -maxdepth 2 -name generate.go -print | sort)
          for pkg in "${pkgs[@]}"; do
            libgo="$pkg/lib.go"
            if [ "$pkg" = "." ]; then
              libgo="./lib.go"
            fi
            dylib=$(sed -n 's/.*DiscoverBuiltDylib(swiftBridgeDir(), "\(lib[^"]*\.dylib\)").*/\1/p' "$libgo" | head -n 1)
            if [ -z "$dylib" ]; then
              dylib=$(sed -n 's/.*BuildSwiftBridge(swiftBridgeDir(), "[^"]*", "\(lib[^"]*\.dylib\)".*/\1/p' "$libgo" | head -n 1)
            fi
            if [ -z "$dylib" ]; then
              echo "failed to determine dylib name from $libgo" >&2
              exit 1
            fi

            product="${dylib#lib}"
            product="${product%.dylib}"
            swift_dir="$pkg/internal/swift"
            if [ "$pkg" = "." ]; then
              swift_dir="./internal/swift"
            fi
            arm_scratch="$swift_dir/.build/universal-arm64"
            x86_scratch="$swift_dir/.build/universal-x86_64"
            out_dir="$swift_dir/.build/universal/release"
            out_dylib="$out_dir/$dylib"

            echo "building $product ($dylib) in $swift_dir"
            rm -rf "$arm_scratch" "$x86_scratch"
            swift build -c release --quiet --product "$product" --triple arm64-apple-macosx --scratch-path "$arm_scratch" --package-path "$swift_dir"
            swift build -c release --quiet --product "$product" --triple x86_64-apple-macosx --scratch-path "$x86_scratch" --package-path "$swift_dir"
            mkdir -p "$out_dir"
            lipo -create -output "$out_dylib" \
              "$arm_scratch/arm64-apple-macosx/release/$dylib" \
              "$x86_scratch/x86_64-apple-macosx/release/$dylib"
            lipo -info "$out_dylib"
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/universal-dylibs
          while IFS= read -r dylib; do
            dest="dist/universal-dylibs/${dylib#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$dylib" "$dest"
          done < <(find . -path '*/.build/universal/release/*.dylib' -type f | sort)
          if [ -z "$(find dist/universal-dylibs -type f -name '*.dylib' -print -quit)" ]; then
            echo "no universal dylibs were produced" >&2
            exit 1
          fi
          tar -C dist -czf dist/universal-dylibs.tar.gz universal-dylibs

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: universal-dylibs
          path: |
            dist/universal-dylibs
            dist/universal-dylibs.tar.gz

      - name: Place dylibs into embeddedbridge dirs
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          while IFS= read -r dylib; do
            pkg_dir=$(echo "$dylib" | sed 's|/internal/swift/.build/universal/release/.*||')
            if [ "$pkg_dir" = "." ]; then
              embed_dir="internal/embeddedbridge"
            else
              embed_dir="$pkg_dir/internal/embeddedbridge"
            fi
            mkdir -p "$embed_dir"
            dylib_name=$(basename "$dylib")
            cp "$dylib" "$embed_dir/$dylib_name"
            # Rewrite payload.go stub to unconditional go:embed
            cat > "$embed_dir/payload.go" <<GOEOF
          package embeddedbridge

          import _ "embed"

          //go:embed $dylib_name
          var bridge []byte

          // Payload returns the embedded bridge dylib payload.
          func Payload() ([]byte, string) {
          	return bridge, "$dylib_name"
          }
          GOEOF
            gofmt -w "$embed_dir/payload.go"
            echo "  $embed_dir/$dylib_name"
          done < <(find . -path '*/.build/universal/release/*.dylib' -type f | sort)

      - name: Commit dylibs to dylibs/main branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git checkout -B dylibs/main
          git add '**/internal/embeddedbridge/*.dylib' '**/internal/embeddedbridge/payload.go'
          if git diff --cached --quiet; then
            echo "no dylib changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "embeddedbridge: update universal dylibs from ${GITHUB_SHA::8}"
            git push --force origin dylibs/main
          fi
          git checkout main

      - name: Publish main snapshot
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Automated universal dylib snapshot built from \`${GITHUB_SHA}\` on \`main\`."
          if gh release view main-snapshot >/dev/null 2>&1; then
            gh release delete main-snapshot --yes
          fi
          git tag -f main-snapshot "${GITHUB_SHA}"
          git push --force origin refs/tags/main-snapshot
          gh release create main-snapshot dist/universal-dylibs.tar.gz \
            --verify-tag \
            --title "Main Snapshot" \
            --notes "$notes" \
            --prerelease \
            --latest=false

      - name: Attach tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/universal-dylibs.tar.gz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/universal-dylibs.tar.gz \
              --verify-tag \
              --generate-notes
          fi
